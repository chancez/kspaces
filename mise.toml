[settings]
lockfile = true

[tools]
go = "prefix:1.27"

[env]
GOBIN = "{{config_root}}/bin/tools"
_.path = ["{{config_root}}/bin/tools"]

# Task scripts are POSIX sh: mise runs them with `sh`, which is dash on Debian and Ubuntu.

[tasks.build]
description = "Build the kspaces binary"
run = "go build -o bin/kspaces ./cmd/kspaces"

[tasks.install]
description = "Build and install kspaces into PREFIX (default ~/.local)"
depends = ["build"]
# Rename from a temp file in the same directory instead of cp. cp writes into the existing inode, which
# on macOS can get later execs of a binary with a running process SIGKILLed, and every tab's sidebar is
# one. The rename is also atomic, so the kitty watcher starting a sidebar during install sees the old
# binary or the new one, never a partial write.
run = """
set -eu
prefix="${PREFIX:-$HOME/.local}"
bindir="$prefix/bin"
mkdir -p "$bindir"
tmp="$(mktemp "$bindir/.kspaces.XXXXXX")"
trap 'rm -f "$tmp"' EXIT
cp bin/kspaces "$tmp"
chmod 755 "$tmp"
mv -f "$tmp" "$bindir/kspaces"
trap - EXIT
echo "installed $("$bindir/kspaces" --version) to $bindir/kspaces"
# kitty.conf's watcher starts the sidebars from ~/.local/bin by absolute path, but its mappings run
# kspaces from PATH, so a different one there would be what they run.
if ! command -v kspaces >/dev/null 2>&1; then
  echo "note: kspaces is not on PATH; add $bindir to it" >&2
elif [ "$(command -v kspaces)" != "$bindir/kspaces" ]; then
  echo "note: $(command -v kspaces) shadows $bindir/kspaces on PATH" >&2
fi
"""

[tasks.uninstall]
description = "Remove kspaces from PREFIX (default ~/.local)"
# Removes the binary only. The config and the folded spaces are left alone.
run = """
set -eu
target="${PREFIX:-$HOME/.local}/bin/kspaces"
if [ -e "$target" ]; then
  rm -f "$target"
  echo "removed $target"
else
  echo "$target is not installed"
fi
"""

[tasks.fmt]
description = "Format Go code"
run = "go fmt ./..."

[tasks.vet]
description = "Vet Go code"
run = "go vet ./..."

[tasks.test]
description = "Run the tests"
run = "go test ./..."

# The release job runs on ubuntu-latest, in UTC, and a test that only passed in local time failed v0.2.0's.
# -count=1, as the cache key leaves TZ out and would replay test's run.
[tasks.test-utc]
description = "Run the tests in UTC, as the release job does"
env = { TZ = "UTC" }
run = "go test -count=1 ./..."

[tasks.test-race]
description = "Run the tests with the race detector"
run = "go test -race ./..."

[tasks.check]
description = "Format, vet, and test, in local time and in UTC"
depends = ["fmt", "vet", "test", "test-utc"]

[tasks.dist]
description = "Build release archives for macOS and Linux into dist/"
# kspaces has no cgo, so one machine builds every target. VERSION is what kspaces --version prints; it
# defaults to git describe. The archives' names leave it out, so releases/latest/download finds them.
run = """
set -eu
version="${VERSION:-$(git describe --tags --always --dirty)}"
rm -rf dist
mkdir -p dist
for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
  os="${target%/*}"
  arch="${target#*/}"
  name="kspaces_${os}_${arch}"
  mkdir -p "dist/$name"
  CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
    -ldflags "-s -w -X github.com/chancez/kspaces/internal/cli.version=$version" \
    -o "dist/$name/kspaces" ./cmd/kspaces
  cp README.md "dist/$name/"
  # kspaces at the archive's root, where mise's github backend and a manual install both find it.
  tar -C "dist/$name" -czf "dist/$name.tar.gz" kspaces README.md
  rm -rf "dist/$name"
done
(cd dist && shasum -a 256 ./*.tar.gz | sed 's# \\./# #' >checksums.txt)
"""
